title: Windows Failed Logon
id: 09d32ae9-dc44-4bd7-a721-4625b23b8d01
status: experimental
description: Detects Windows Security Event ID 4625 generated by a failed account logon.
author: Harold Heard
date: 2026-08-25
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  condition: selection
falsepositives:
  - User typing errors
  - Expired or cached credentials
  - Misconfigured services or scheduled tasks
level: low
tags:
  - attack.credential_access
  - attack.t1110
